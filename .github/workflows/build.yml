name: Build YinnMotion APK & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v1.2.0"
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build 32-bit, 64-bit & Universal APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=YinnMotion ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build three release APKs
        run: gradle --no-daemon assembleRelease

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          mkdir -p release

          APK_64=$(find "$OUT" -type f -name '*arm64-v8a*release*.apk' -print -quit)
          APK_32=$(find "$OUT" -type f -name '*armeabi-v7a*release*.apk' -print -quit)
          APK_UNIVERSAL=$(find "$OUT" -type f -name '*universal*release*.apk' -print -quit)

          test -n "$APK_64" || { echo "64-bit APK not found"; exit 1; }
          test -n "$APK_32" || { echo "32-bit APK not found"; exit 1; }
          test -n "$APK_UNIVERSAL" || { echo "Universal APK not found"; exit 1; }

          cp "$APK_64" "release/YinnMotion-${VERSION}-arm64-v8a.apk"
          cp "$APK_32" "release/YinnMotion-${VERSION}-armeabi-v7a.apk"
          cp "$APK_UNIVERSAL" "release/YinnMotion-${VERSION}-universal.apk"

          echo "Release APKs:"
          ls -lh release/

      - name: Publish GitHub Release
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: "YinnMotion release: three APK variants (arm64-v8a, armeabi-v7a, universal)."
          files: release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
