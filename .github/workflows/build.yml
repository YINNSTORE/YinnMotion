name: Build YinnMotion APK & Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=YinnMotion ${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK"
          cp "$APK" "release/YinnMotion-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
